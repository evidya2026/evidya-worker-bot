<style>

  <div style="display:flex;gap:8px;">
    <button id="tabTasksBtn" onclick="switchMainTab('tasks')" style="flex:1;background:#667eea;">📋 My Tasks</button>

  <a id="openNotebookLmBtn" href="https://notebooklm.google.com/" target="_blank" style="display:none;text-align:center;background:#4c1d95;color:white;padding:12px;border-radius:8px;font-weight:700;text-decoration:none;margin-bottom:10px;">🔗 Open NotebookLM</a>

  <textarea id="taskContent" placeholder="Paste the AI-generated content here..."></textarea>

  <div id="mediaVideoSection" style="display:none;">
   <input id="videoIdInput" placeholder="Paste the full YouTube video link here" style="margin-bottom:10px;">

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA3-rvQJ1g9K-1l8-_PXX8IffG8W4qU7AE",
  authDomain: "evidya-academy.firebaseapp.com",
  projectId: "evidya-academy",
  storageBucket: "evidya-academy.firebasestorage.app",
  messagingSenderId: "86172698431",
  appId: "1:86172698431:web:eb3bd5b2887cda88eb358a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let currentWorker = null, currentJobId = null;

async function login() {
  const code = document.getElementById('workerCode').value.trim().toUpperCase();
  const doc = await db.collection('workers').doc(code).get();
  if (!doc.exists || doc.data().status === 'BLOCKED') {
    document.getElementById('loginError').textContent = 'Invalid or blocked code.';
    return;
  }
 currentWorker = code;
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('mainTabsBox').style.display = 'block';
  document.getElementById('jobsBox').style.display = 'block';
  showWelcomeAndYesterday();
  loadJobs();
}

function getDayRange(daysAgo) {
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const start = new Date(startOfToday);
  start.setDate(start.getDate() - daysAgo);
  const end = new Date(start);
  end.setDate(end.getDate() + 1);
  return { start: start.toISOString(), end: end.toISOString() };
}

async function fetchCountsForRange(range) {
  const counts = { submitted: 0, published: 0, rejected: 0 };
  try {
    const snap = await db.collection('jobHistory')
      .where('worker', '==', currentWorker)
      .where('timestamp', '>=', range.start)
      .where('timestamp', '<', range.end)
      .get();
    snap.forEach(d => { const h = d.data(); counts[h.eventType] = (counts[h.eventType] || 0) + 1; });
  } catch (err) {
    console.error('Report fetch failed (may need a Firestore index — check console for a link):', err);
  }
  return counts;
}

function renderStatRow(label, counts) {
  return `
    <div style="margin-top:10px;">
      <div style="font-size:12px;color:#666;">${label}</div>
      <div style="display:flex;justify-content:center;gap:18px;margin-top:6px;">
        <div><div style="font-size:20px;font-weight:900;color:#059669;">${counts.submitted}</div><div style="font-size:10px;color:#666;">Submitted</div></div>
        <div><div style="font-size:20px;font-weight:900;color:#2563eb;">${counts.published}</div><div style="font-size:10px;color:#666;">Approved</div></div>
        <div><div style="font-size:20px;font-weight:900;color:#dc2626;">${counts.rejected}</div><div style="font-size:10px;color:#666;">Rejected</div></div>
      </div>
    </div>`;
}

async function showWelcomeAndYesterday() {
  const todayCounts = await fetchCountsForRange(getDayRange(0));
  const yesterdayCounts = await fetchCountsForRange(getDayRange(1));

  let name = currentWorker;
  try {
    const wdoc = await db.collection('workers').doc(currentWorker).get();
    if (wdoc.exists && wdoc.data().name) name = wdoc.data().name;
  } catch (err) {}

  document.getElementById('welcomeBox').innerHTML = `
    <div class="box" style="text-align:center;">
      <img src="https://raw.githubusercontent.com/happysangitanms/assets/main/LOGO.png" style="width:56px;margin-bottom:8px;">
      <div style="font-size:17px;font-weight:800;color:#4c1d95;">Welcome, ${name}! 👋</div>
      ${renderStatRow("Today's Performance", todayCounts)}
      ${renderStatRow("Yesterday's Performance", yesterdayCounts)}
    </div>`;
}
function switchMainTab(tab) {
  document.getElementById('jobsBox').style.display = tab === 'tasks' ? 'block' : 'none';
  document.getElementById('perfReportBox').style.display = tab === 'perf' ? 'block' : 'none';
  document.getElementById('tabTasksBtn').style.background = tab === 'tasks' ? '#667eea' : '#999';
  document.getElementById('tabPerfBtn').style.background = tab === 'perf' ? '#667eea' : '#999';
  if (tab === 'perf') loadMyPerformance();
}

async function loadMyPerformance() {
  const wrap = document.getElementById('perfReportBox');
  wrap.innerHTML = '<div class="box">Loading...</div>';
  try {
    const histSnap = await db.collection('jobHistory').where('worker', '==', currentWorker).orderBy('timestamp', 'asc').get();
    window.myPerfAllEvents = histSnap.docs.map(d => d.data());

    wrap.innerHTML = `<div class="box">
      <div style="margin-bottom:10px;">
        <select id="perfRangeSelect" onchange="onPerfRangeChange()" style="width:100%;padding:10px;border-radius:8px;border:2px solid #e0e0e0;font-size:14px;">
          <option value="today">Today</option>
          <option value="yesterday">Yesterday</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
          <option value="custom">Custom Range</option>
          <option value="till" selected>Till Date (All Time)</option>
        </select>
      </div>
      <div id="perfCustomDates" style="display:none;gap:8px;margin-bottom:10px;">
        <input type="date" id="perfCustomStart" style="width:48%;padding:10px;display:inline-block;margin-right:4%;">
        <input type="date" id="perfCustomEnd" style="width:48%;padding:10px;display:inline-block;">
        <button onclick="applyPerfRangeFilter()" style="margin-top:8px;">Apply Custom Range</button>
      </div>
      <div id="perfResultsWrap"></div>
    </div>`;
    applyPerfRangeFilter();
  } catch (err) {
    console.error(err);
    wrap.innerHTML = '<div class="box" style="color:red;font-size:12px;">Failed to load. (May need a Firestore index — check browser console for a setup link.)</div>';
  }
}

function onPerfRangeChange() {
  const val = document.getElementById('perfRangeSelect').value;
  document.getElementById('perfCustomDates').style.display = val === 'custom' ? 'block' : 'none';
  if (val !== 'custom') applyPerfRangeFilter();
}

function getPresetRange(preset) {
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (preset === 'today') {
    const end = new Date(startOfToday); end.setDate(end.getDate() + 1);
    return { start: startOfToday, end: end };
  }
  if (preset === 'yesterday') {
    const start = new Date(startOfToday); start.setDate(start.getDate() - 1);
    return { start: start, end: startOfToday };
  }
  if (preset === 'week') {
    const start = new Date(startOfToday); start.setDate(start.getDate() - 6);
    const end = new Date(startOfToday); end.setDate(end.getDate() + 1);
    return { start: start, end: end };
  }
  if (preset === 'month') {
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(startOfToday); end.setDate(end.getDate() + 1);
    return { start: start, end: end };
  }
  return null; // 'till' = no filter
}

function applyPerfRangeFilter() {
  const preset = document.getElementById('perfRangeSelect').value;
  let range = null;
  if (preset === 'custom') {
    const s = document.getElementById('perfCustomStart').value;
    const e = document.getElementById('perfCustomEnd').value;
    if (!s || !e) { document.getElementById('perfResultsWrap').innerHTML = '<p style="font-size:12px;color:#666;">Pick both start and end dates.</p>'; return; }
    const start = new Date(s);
    const end = new Date(e); end.setDate(end.getDate() + 1); // include the whole end day
    range = { start, end };
  } else {
    range = getPresetRange(preset);
  }

  const allEvents = window.myPerfAllEvents || [];
  const filtered = range ? allEvents.filter(ev => {
    const t = new Date(ev.timestamp);
    return t >= range.start && t < range.end;
  }) : allEvents;

  const counts = { submitted: 0, published: 0, rejected: 0 };
  const historyByJob = {};
  filtered.forEach(h => {
    counts[h.eventType] = (counts[h.eventType] || 0) + 1;
    if (!historyByJob[h.jobId]) historyByJob[h.jobId] = { label: h.jobLabel, events: [] };
    historyByJob[h.jobId].events.push(h);
  });
  const decided = counts.published + counts.rejected;
  const approvalRate = decided ? Math.round((counts.published / decided) * 100) : 0;
  window.myPerfData = { counts, approvalRate, historyByJob };

  let historyHtml = '<h4 style="margin-top:14px;">📅 Date-wise History</h4>';
  const ids = Object.keys(historyByJob);
  if (ids.length === 0) {
    historyHtml += '<p style="font-size:12px;color:#666;">No history in this period.</p>';
  } else {
    ids.forEach(jid => {
      const jh = historyByJob[jid];
      historyHtml += `<div style="background:#f7f7f7;border-radius:8px;padding:8px;margin-bottom:8px;"><b style="font-size:12.5px;">${jh.label}</b>`;
      jh.events.forEach(ev => {
        const label = ev.eventType === 'rejected' ? 'Rejected' : ev.eventType === 'submitted' ? 'Resubmitted' : 'Final Approved';
        historyHtml += `<div style="font-size:11px;color:#333;">- ${label} — ${new Date(ev.timestamp).toLocaleString('en-IN')}${ev.note ? ' — Reason: ' + ev.note : ''}</div>`;
      });
      historyHtml += '</div>';
    });
  }

  document.getElementById('perfResultsWrap').innerHTML = `
    <div style="display:flex;justify-content:space-around;text-align:center;margin:10px 0;">
      <div><div style="font-size:20px;font-weight:900;color:#059669;">${counts.submitted}</div><div style="font-size:10px;">Submitted</div></div>
      <div><div style="font-size:20px;font-weight:900;color:#2563eb;">${counts.published}</div><div style="font-size:10px;">Published</div></div>
      <div><div style="font-size:20px;font-weight:900;color:#dc2626;">${counts.rejected}</div><div style="font-size:10px;">Rejected</div></div>
      <div><div style="font-size:20px;font-weight:900;color:#7c3aed;">${approvalRate}%</div><div style="font-size:10px;">Approval</div></div>
    </div>
    ${historyHtml}
    <button onclick="downloadMyPerformancePDF()" style="background:#4c1d95;">⬇️ Download My Performance PDF</button>`;
}
async function downloadMyPerformancePDF() {
  const a = window.myPerfData;
  if (!a) return;
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:-9999px;top:0;width:600px;background:#fff;padding:30px;font-family:sans-serif;color:#000;';
  let historyHtml = '';
  Object.keys(a.historyByJob).forEach(jid => {
    const jh = a.historyByJob[jid];
    historyHtml += `<div style="margin-top:8px;font-size:12px;font-weight:700;">${jh.label}</div>`;
    jh.events.forEach(ev => {
      const label = ev.eventType === 'rejected' ? 'Rejected' : ev.eventType === 'submitted' ? 'Resubmitted' : 'Final Approved & Published';
      historyHtml += `<div style="font-size:10.5px;padding-left:10px;">- ${label} — ${new Date(ev.timestamp).toLocaleString('en-IN')}${ev.note ? ' — Reason: ' + ev.note : ''}</div>`;
    });
  });
  container.innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #4c1d95;padding-bottom:12px;margin-bottom:16px;">
      <img src="https://raw.githubusercontent.com/happysangitanms/assets/main/LOGO.png" style="width:56px;">
      <div><div style="font-size:19px;font-weight:900;">E-Vidya Academy</div><div style="font-size:11px;">My Performance Report — ${currentWorker}</div></div>
    </div>
   <div style="font-size:13px;">Submitted: <b>${a.counts.submitted}</b> | Published: <b>${a.counts.published}</b> | Rejected: <b>${a.counts.rejected}</b> | Approval Rate: <b>${a.approvalRate}%</b></div>
    ${historyHtml}`;
  document.body.appendChild(container);
  try {
    const canvas = await html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const w = pdf.internal.pageSize.getWidth();
    pdf.addImage(imgData, 'PNG', 0, 0, w, (canvas.height * w) / canvas.width);
    pdf.save('My_Performance_' + currentWorker + '.pdf');
  } catch (err) {
    alert('Failed to generate PDF.');
  } finally {
    document.body.removeChild(container);
  }
}

let jobsCache = {};

let currentWorkerJobFilter = 'all';

function workerJobCategory(j) {
  if (j.jobCategory) return j.jobCategory;
  return j.jobKind === 'media' ? 'upload' : 'publish';
}

async function loadJobs() {
  const snap = await db.collection('jobs')
    .where('assignedWorker', '==', currentWorker)
    .where('status', 'in', ['open', 'rejected']).get();
  jobsCache = {};
  snap.docs.forEach(d => { jobsCache[d.id] = d.data(); });
  renderJobTabs();
}

function renderJobTabs() {
  const wrap = document.getElementById('jobsBox');
  const allIds = Object.keys(jobsCache);
  if (allIds.length === 0) { wrap.innerHTML = '<div class="box">No tasks assigned right now.</div>'; return; }

  const filteredIds = allIds.filter(id => currentWorkerJobFilter === 'all' || workerJobCategory(jobsCache[id]) === currentWorkerJobFilter);

  let html = '<h3>Your Tasks</h3>';
  html += `<div style="display:flex;gap:8px;margin-bottom:12px;">
    <button style="flex:1;background:${currentWorkerJobFilter==='all'?'#667eea':'#999'};" onclick="setWorkerJobFilter('all')">All</button>
    <button style="flex:1;background:${currentWorkerJobFilter==='upload'?'#667eea':'#999'};" onclick="setWorkerJobFilter('upload')">📤 Upload Jobs</button>
    <button style="flex:1;background:${currentWorkerJobFilter==='publish'?'#667eea':'#999'};" onclick="setWorkerJobFilter('publish')">📝 Publish Jobs</button>
  </div>`;

  if (filteredIds.length === 0) {
    html += '<div class="box">No tasks in this category right now.</div>';
  } else {
    filteredIds.forEach(id => {
      html += `<div class="job" data-job-id="${id}">${jobsCache[id].workerLabel || 'Task'}</div>`;
    });
  }

  wrap.innerHTML = html;
  document.querySelectorAll('.job').forEach(el => {
    el.addEventListener('click', () => openTask(el.getAttribute('data-job-id')));
  });
}

function setWorkerJobFilter(f) {
  currentWorkerJobFilter = f;
  renderJobTabs();
}

function openTask(id) {
  currentJobId = id;
  document.getElementById('taskContent').value = ''; // always start blank — never show leftover text from a previous job
  const j = jobsCache[id];
  document.getElementById('taskTitle').textContent = j.workerLabel || 'Task';
  document.getElementById('taskInstructions').textContent = j.workerInstructions || 'Copy the prompt, paste it into ChatGPT or Claude, then paste the AI\'s response below.';
  document.getElementById('taskBox').style.display = 'block';
  document.getElementById('taskBox').scrollIntoView({behavior:'smooth'});

  const isMedia = j.jobKind === 'media';
  const isFileUpload = isMedia && (j.mediaType === 'audio' || j.mediaType === 'pdf' || j.mediaType === 'infographic');
  const isVideo = isMedia && j.mediaType === 'video';
const isNotebookMedia = isMedia && (j.mediaType === 'audio' || j.mediaType === 'video' || j.mediaType === 'pdf');

  const copyBtnEl = document.getElementById('copyPromptBtn');
  if (isMedia) {
    copyBtnEl.textContent = '📄 Source Text';
  } else {
    copyBtnEl.textContent = '📋 Copy Prompt for AI';
  }
  document.getElementById('copyNotebookBtn').textContent = '🤖 Prompt Text';

  document.getElementById('taskContent').style.display = isMedia ? 'none' : 'block';
  document.getElementById('mediaFileSection').style.display = isFileUpload ? 'block' : 'none';
  document.getElementById('mediaVideoSection').style.display = isVideo ? 'block' : 'none';
  document.getElementById('submitTextBtn').style.display = isMedia ? 'none' : 'block';
  document.getElementById('copyNotebookBtn').style.display = isNotebookMedia ? 'block' : 'none';
  document.getElementById('openNotebookLmBtn').style.display = isNotebookMedia ? 'block' : 'none';

  if (isFileUpload) {
    document.getElementById('mediaFileNameHint').textContent = 'This file will be saved as: ' + j.r2Key;
  }

  // Show correct compression site link
  const compressLinks = {
    audio: 'https://audio.pi7.org/compress-audio',
    video: 'https://clideo.com/compress-video',
    pdf: 'https://smallpdf.com/compress-pdf',
    infographic: 'https://smallpdf.com/compress-pdf'
  };
  const linkBtn = document.getElementById('compressLinkBtn');
  if (isMedia && compressLinks[j.mediaType]) {
    linkBtn.href = compressLinks[j.mediaType];
    linkBtn.style.display = 'inline-block';
  } else {
    linkBtn.style.display = 'none';
  }
}

async function copyTextToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(text);
  } else {
    // Fallback for older/some mobile browsers
    const temp = document.createElement('textarea');
    temp.value = text;
    temp.style.position = 'fixed';
    temp.style.left = '-9999px';
    document.body.appendChild(temp);
    temp.focus();
    temp.select();
    document.execCommand('copy');
    document.body.removeChild(temp);
  }
}

async function copyPrompt() {
  const j = jobsCache[currentJobId];
  const isMedia = j && j.jobKind === 'media';
  const text = j ? (isMedia ? (j.sourceText || j.promptText || '') : (j.promptText || '')) : '';
  const restoreLabel = isMedia ? '📄 Source Text' : '📋 Copy Prompt for AI';
  const btn = document.getElementById('copyPromptBtn');
  try {
    await copyTextToClipboard(text);
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = restoreLabel; }, 2000);
  } catch (err) {
    alert('Could not copy automatically. Please select and copy the text manually.');
  }
}

async function copyNotebookPrompt() {
  const j = jobsCache[currentJobId];
  const text = j ? (j.promptOnly || '') : '';
  const btn = document.getElementById('copyNotebookBtn');
  try {
    await copyTextToClipboard(text);
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = '🤖 Prompt Text'; }, 2000);
  } catch (err) {
    alert('Could not copy automatically. Please select and copy the text manually.');
  }
}
  
async function logJobEvent(jobId, eventType, note) {
  try {
    const j = jobsCache[jobId] || {};
    await db.collection('jobHistory').add({
      jobId: jobId,
      jobLabel: j.workerLabel || j.title || jobId,
      jobTitle: j.title || '',
      worker: currentWorker,
      eventType: eventType,
      note: note || '',
      timestamp: new Date().toISOString()
    });
  } catch (err) {
    console.error('logJobEvent failed (non-fatal):', err);
  }
}

async function submitTask() {
  const text = document.getElementById('taskContent').value.trim();
  if (!text) { alert('Please paste the content first.'); return; }
  await db.collection('jobs').doc(currentJobId).update({
    status: 'submitted', submittedText: text, submittedAt: new Date().toISOString()
  });
  await logJobEvent(currentJobId, 'submitted', '');
  alert('Submitted! Thank you.');
  document.getElementById('taskBox').style.display = 'none';
  loadJobs();
}

async function uploadMediaFile() {
  const fileInput = document.getElementById('mediaFileInput');
  const statusEl = document.getElementById('uploadStatus');
  const j = jobsCache[currentJobId];
  if (!fileInput.files.length) { statusEl.textContent = 'Please choose a file first.'; return; }

  const file = fileInput.files[0];
  statusEl.textContent = 'Uploading...';
  try {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('key', j.r2Key);
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const rawText = await res.text();
    let result;
    try {
      result = JSON.parse(rawText);
    } catch (parseErr) {
      throw new Error(`Server returned status ${res.status} with no valid response (endpoint may be missing on this domain). Raw: "${rawText.slice(0,150)}"`);
    }
    if (!result.success) throw new Error(result.error || 'Upload failed');

await db.collection('jobs').doc(currentJobId).update({
      status: 'submitted', submittedAt: new Date().toISOString()
    });
    await logJobEvent(currentJobId, 'submitted', '');
    statusEl.textContent = '✅ Uploaded successfully!';
    setTimeout(() => { document.getElementById('taskBox').style.display = 'none'; loadJobs(); }, 1200);
  } catch (err) {
    statusEl.textContent = '❌ Upload failed: ' + err.message;
  }
}

function extractYouTubeId(input) {
  input = input.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input; // already a bare ID
  const match = input.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
  return match ? match[1] : input;
}

async function submitVideoId() {
  const raw = document.getElementById('videoIdInput').value.trim();
  if (!raw) { alert('Please paste the YouTube video link.'); return; }
  const videoId = extractYouTubeId(raw);
  await db.collection('jobs').doc(currentJobId).update({
    status: 'submitted', submittedText: videoId, submittedAt: new Date().toISOString()
  });
  await logJobEvent(currentJobId, 'submitted', '');
  alert('Submitted!');
  document.getElementById('taskBox').style.display = 'none';
  loadJobs();
}
</script>
